name = "invoice-number-cf-worker"
main = "src/index.ts"
compatibility_date = "2026-04-20"

[[durable_objects.bindings]]
name = "INVOICE_COUNTER"
class_name = "InvoiceYearCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InvoiceYearCounter"]

# Dev worker uses a separate Durable Object namespace so local/testing
# does not consume production invoice sequence numbers.
[env.dev]
name = "invoice-number-cf-worker-dev"

[[env.dev.durable_objects.bindings]]
name = "INVOICE_COUNTER"
class_name = "InvoiceYearCounter"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["InvoiceYearCounter"]
